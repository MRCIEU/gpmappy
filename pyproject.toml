[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gpmappy"
version = "0.1.0"
description = "Python client for the OpenGWAS genotype-phenotype map API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "gpmappy contributors" }
]
keywords = ["genetics", "gwas", "opengwas", "api", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.24,<1.0",
  "typing-extensions>=4.9.0; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/your-org/gpmappy"
Repository = "https://github.com/your-org/gpmappy"
Issues = "https://github.com/your-org/gpmappy/issues"
Documentation = "https://your-org.github.io/gpmappy/"

[project.optional-dependencies]
dataframe = [
  "pandas>=1.5,<3.0"
]
dev = [
  "pandas>=1.5,<3.0",
  "pytest>=7.2.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.10.0",
  "respx>=0.20.0",
  "vcrpy>=5.1.0",
  "ruff>=0.1.0",
  "black>=23.0.0",
  "mypy>=1.5.0",
  "pre-commit>=3.7.0"
]
docs = [
  "mkdocs>=1.4.0",
  "mkdocs-material>=9.0.0",
  "mkdocstrings[python]>=0.23.0"
]
bench = [
  "pytest-benchmark>=4.0.0",
  "pandas>=1.5,<3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpmappy"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gpmappy"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=gpmappy --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "integration: integration tests",
  "live: tests that hit live OpenGWAS endpoints"
]

[tool.coverage.run]
branch = true
source = ["src/gpmappy"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
