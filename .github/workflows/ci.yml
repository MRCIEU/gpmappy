name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
        env:
          # Also run the tests marked 'live' against the production API. They skip themselves when
          # it can't be reached or this gpmappy doesn't support its version (tests/conftest.py).
          GPMAPPY_RUN_LIVE: "1"
      - name: Build and check package
        run: |
          python -m build
          twine check dist/*
